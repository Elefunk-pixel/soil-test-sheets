name: Build Android app

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the project and use the newest app.html
        run: |
          unzip -qo project.zip
          cp app.html dist/app.html

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Point the build at the Android tools already on the runner
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK_HOME=${NDK}" >> "$GITHUB_ENV"
          echo "Using NDK at ${NDK}"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" || true
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Use the fixed signing key
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "Using the fixed signing key."
          else
            echo "::warning::No DEBUG_KEYSTORE_B64 secret found. This APK gets a random key and cannot be installed over an older copy."
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm install

      - name: Download fonts
        run: bash scripts/get-fonts.sh

      - name: Make app icons
        run: npx tauri icon app-icon.png

      - name: Set up the Android project
        run: npx tauri android init

      - name: Build the APK
        run: npx tauri android build --debug --apk --target aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: soil-test-sheets-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
